; GridSeis weather house firmware: Waveshare ESP32-S3-Zero (4 MB flash), ESP-IDF framework.
; The S3-Zero uses the chip's own USB for flashing and the serial monitor.
; Build:  pio run          Flash:  pio run -t upload          Watch:  pio device monitor
[env:esp32-s3-zero]
platform = espressif32
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
